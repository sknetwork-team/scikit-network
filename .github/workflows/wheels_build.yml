# Taken from https://cibuildwheel.readthedocs.io/en/stable/setup/

name: Wheels build

on: [pull_request, workflow_dispatch]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: auto
          # Pinned so this bump stays purely additive. cibuildwheel's default
          # manylinux image changed from manylinux2014 to manylinux_2_28 in 3.0,
          # which would raise the glibc floor of every published wheel from 2.17
          # to 2.28 - unrelated to Python 3.14, and a breaking change for anyone
          # on an older distro who currently gets a wheel. Moving to
          # manylinux_2_28 is a reasonable thing to do, but as its own decision.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_ARCHS: auto64
          CIBW_SKIP: cp*-musllinux* *-win32
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_BUILD_VERBOSITY: 3
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: "pip install -r requirements_dev.txt && pip install ."
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse

  build_sdist:
      name: Build source distribution
      runs-on: ubuntu-latest
      steps:
          -   uses: actions/checkout@v4

          -   uses: actions/setup-python@v5
              name: Install Python
              with:
                  python-version: '3.10'
                  
          -   name: Build sdist
              run: |
                python -m pip install .
                python -m pip install -r requirements_dev.txt .
                python -m build

          -   uses: actions/upload-artifact@v4
              with:
                  path: dist/*.tar.gz
